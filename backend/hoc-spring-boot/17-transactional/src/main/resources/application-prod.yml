# Profile "prod": bật khi chạy với --spring.profiles.active=prod
server:
  port: 80

logging:
  level:
    root: WARN               # thư viện: chỉ cảnh báo và lỗi
    vn.moc.orderapi: INFO    # code của mình: vẫn giữ dòng log của mỗi request

# Không công khai tài liệu API và Swagger UI trên máy chủ thật
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
