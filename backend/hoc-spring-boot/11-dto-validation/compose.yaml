# PostgreSQL cho máy dev. Bảng do Flyway tạo khi order-api khởi động (src/main/resources/db/migration).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: order_api
      POSTGRES_USER: order_api
      POSTGRES_PASSWORD: order_api_dev   # chỉ dùng trên máy dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
